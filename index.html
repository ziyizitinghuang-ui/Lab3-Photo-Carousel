<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Dog's Day</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header>
            <h1>A Dog's Day</h1>

            <p class="intro">
                A little day in photos.
            </p>
        </header>

        <div class="sequence-buttons">

            <button id="storyOne" class="story-button active">
                Waiting for Playtime
            </button>

            <button id="storyTwo" class="story-button">
                After Playtime
            </button>

        </div>

        <section class="carousel">

            <div class="camera-area">

                <div class="camera-screen">
                    <img
                        id="storyImage"
                        src="images/waiting.jpg"
                        alt="Golden retriever"
                    >
                </div>

                <img
                    class="camera-frame"
                    src="images/camera.png"
                    alt=""
                >

            </div>

            <div class="story-text">

                <p id="step">
                    BEGINNING
                </p>

                <h2 id="captionTitle">
                    So Bored...
                </h2>

                <p id="captionText">
                    I wish we could go outside.
                </p>

            </div>

            <div class="controls">

                <button id="previousButton">
                    ← Previous
                </button>

                <p id="counter">
                    1 / 3
                </p>

                <button id="nextButton">
                    Next →
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
